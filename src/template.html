<body>
<div id="banner"></div>
<header class="topbar"><button class="logo-btn" data-go="start" aria-label="ayrup — на головну"><span class="logo">__LOGO__</span></button><nav id="nav"></nav></header>
<main id="app" tabindex="-1"></main>
<div id="toast" class="toast" hidden role="status"></div>
<script>
const DATA = __DATA__;
(function(){
"use strict";
const SYS = Object.fromEntries(DATA.systems.map(s=>[s.id,s]));
const ROLE = Object.fromEntries(DATA.roles.map(r=>[r.id,r]));
const PROF = Object.fromEntries(DATA.profiles.map(p=>[p.id,p]));
const ORG = Object.fromEntries(DATA.orgtypes.map(o=>[o.id,o]));
const SCORE = {g:1,a:.5,c:0,u:0};
const STATUS = {g:"Готово",a:"Частково",c:"Бракує",u:"Не знаю"};
const JOURNAL = {g:"Правильний хід.",a:"Частково.",c:"Ризиковано."};
const CFG = window.AYRUP_CONFIG || {};
const REMOTE = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "x"+Math.random().toString(36).slice(2)+Date.now().toString(36));
const pct = x => Math.round(x*100);
const tone = x => x==null ? "n" : x>=.75 ? "g" : x>=.45 ? "a" : "c";
const colorVar = t => ({g:"var(--green)",a:"var(--amber)",c:"var(--coral)",n:"var(--line)",u:"var(--line)"}[t]);
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function store(k,v){try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||"null"); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null }}
const session = {
  get(){ return store("ayrup.session") || {pilot:null, members:{}, drafts:{}} },
  set(s){ store("ayrup.session", s) }
};

/* ---------- which situations a profile plays ---------- */
function situationsFor(profile){
  return DATA.situations.filter(s=>{
    if(s.layer==="base") return true;
    if(s.layer==="grant") return profile==="A" || ((profile==="B"||profile==="V") && s.key);
    if(s.layer==="self") return profile==="G" || profile==="V";
    return false;
  });
}
/* which situations a particular crew member plays */
const ROLE_BLOCKS=["finance","ops","comms","content"];
function sitsFor(profile,me,covered){
  if(!me) return situationsFor(profile);
  return situationsFor(profile).filter(s=>{
    if(s.aud && s.aud.includes("all")) return true;
    if(s.rb){ const r=s.aud[0]; return r===me.role || (me.pilot && !(covered||[]).includes(r)) }
    if(me.pilot) return true;
    return (s.who||[]).includes(me.role);
  });
}
const isLearning = (s,profile) => s.layer==="grant" && (profile==="B"||profile==="V");

/* ---------- storage: local (demo) and remote (Supabase RPC) ---------- */
const Local = {
  db(){ return store("ayrup.db") || {leads:{}, flights:{}, members:{}} },
  save(d){ store("ayrup.db", d) },
  async register(p){ const d=this.db(); const id=uid(), token=uid(); d.leads[token]={id,token,...p,source:"pilot",created:Date.now()}; this.save(d); return {token} },
  async createFlight(token,f){ const d=this.db(); const lead=d.leads[token]; if(!lead) throw new Error("Сесію не знайдено, зареєструйтесь ще раз");
    const id=uid(); const now=Date.now();
    d.flights[id]={id,pilot:token,...f,created:now,deadline:now+f.window*3600e3,closed:false};
    const mt=uid(); d.members[mt]={token:mt,flight:id,name:lead.name,role:f.pilotRole,pilot:true,answers:null,finished:null,lead:token};
    this.save(d); return {flightId:id, memberToken:mt} },
  async listFlights(token){ const d=this.db(); return Object.values(d.flights).filter(f=>f.pilot===token).sort((a,b)=>b.created-a.created).map(f=>this._pub(d,f)) },
  _pub(d,f){ const ms=Object.values(d.members).filter(m=>m.flight===f.id); const pilot=d.leads[f.pilot];
    return {id:f.id,project:f.project,profile:f.profile,orgtype:f.orgtype,crewSize:f.crewSize,deadline:f.deadline,closed:f.closed,pilotName:pilot?pilot.name:"",
      members:ms.map(m=>({name:m.name,role:m.role,pilot:m.pilot,finished:!!m.finished}))} },
  async flight(id){ const d=this.db(); const f=d.flights[id]; if(!f) throw new Error("Рейс не знайдено. Перевірте посилання."); return this._pub(d,f) },
  async join(id,p){ const d=this.db(); if(!d.flights[id]) throw new Error("Рейс не знайдено. Перевірте посилання.");
    const lt=uid(); d.leads[lt]={token:lt,name:p.name,email:p.email,consent:p.consent,source:"crew",created:Date.now()};
    const mt=uid(); d.members[mt]={token:mt,flight:id,name:p.name,role:p.role,pilot:false,answers:null,finished:null,lead:lt}; this.save(d); return {memberToken:mt} },
  async submit(mt,answers){ const d=this.db(); const m=d.members[mt]; if(!m) throw new Error("Учасника не знайдено"); m.answers=answers; m.finished=Date.now(); this.save(d); return true },
  async close(token,id){ const d=this.db(); const f=d.flights[id]; if(f&&f.pilot===token){f.closed=true;this.save(d)} return true },
  async results(id,token){ const d=this.db(); const f=d.flights[id]; if(!f) throw new Error("Рейс не знайдено");
    const allowed = f.pilot===token || Object.values(d.members).some(m=>m.flight===id && m.token===token);
    if(!allowed) throw new Error("Немає доступу до результатів цього рейсу");
    const ms=Object.values(d.members).filter(m=>m.flight===id);
    const done=ms.filter(m=>m.finished).length;
    const unlocked = f.closed || Date.now()>f.deadline || done>=f.crewSize;
    return {flight:this._pub(d,f), unlocked, members: unlocked ? ms.filter(m=>m.finished).map(m=>({name:m.name,role:m.role,pilot:m.pilot,answers:m.answers})) : []} },
  async expert(token,id,msg){ const d=this.db(); if(d.leads[token]){d.leads[token].wantsExpert={flight:id,msg,at:Date.now()}; this.save(d)} return true },
  async demoCrew(id){ const d=this.db(); const f=d.flights[id];
    const people=[["Олена","finance",.75],["Максим","ops",.45],["Ірина","comms",.6]].slice(0,Math.max(1,f.crewSize-1));
    for(const [name,role,skill] of people){ const mt=uid(); const answers={}; const sits=sitsFor(f.profile,{role,pilot:false});
      for(const s of sits){ const r=Math.random(); let idx;
        if(r<.12){ answers[s.id]={o:-1,ask:pick(["role:finance","giver","expert","none"])}; continue }
        const good=s.options.findIndex(o=>o.s==="g"), mid=s.options.findIndex(o=>o.s==="a"), bad=s.options.findIndex(o=>o.s==="c");
        idx = r<skill ? good : (r<skill+.2 && mid>=0 ? mid : (bad>=0?bad:good));

    this.save(d); return true }
};

/* ---------- scoring ---------- */
function analyse(flight,members){
  const sits=situationsFor(flight.profile); const prof=flight.profile;
  const status=(s,a)=> !a ? null : a.o===-1 ? "u" : s.options[a.o]?.s;
  const per=sits.map(s=>{ const st=members.map(m=>status(s,m.answers?.[s.id])).filter(Boolean); const sc=st.length?st.reduce((x,y)=>x+SCORE[y],0)/st.length:null;
    const counts={}; st.forEach(x=>counts[x]=(counts[x]||0)+1); const agree= st.length>1 ? Math.max(...Object.values(counts))/st.length : null;
    return {s,st,sc,agree,learning:isLearning(s,prof)} });
  const sysScore={}; DATA.systems.forEach(sy=>{ const xs=per.filter(p=>p.s.sys===sy.id&&!p.learning&&p.sc!=null); sysScore[sy.id]= xs.length ? xs.reduce((a,b)=>a+b.sc,0)/xs.length : null });
  const vals=Object.values(sysScore).filter(v=>v!=null); const coverage= vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
  const ag=per.filter(p=>p.agree!=null&&!p.learning); const alignment= ag.length ? ag.reduce((a,b)=>a+b.agree,0)/ag.length : null;
  const readiness = alignment==null ? coverage : coverage*(.8+.2*alignment);
  const grantSet = per.filter(p=>p.s.layer==="grant"&&p.sc!=null); const grant = (prof!=="G"&&grantSet.length) ? grantSet.reduce((a,b)=>a+b.sc,0)/grantSet.length : null;
  // competence map
  const memberSys = members.map(m=>{ const o={}; DATA.systems.forEach(sy=>{ const xs=sits.filter(s=>s.sys===sy.id).map(s=>status(s,m.answers?.[s.id])).filter(Boolean); o[sy.id]= xs.length? xs.reduce((a,b)=>a+SCORE[b],0)/xs.length : null }); return o });
  const sysCover={}; DATA.systems.forEach(sy=>{ sysCover[sy.id]=memberSys.filter(o=>o[sy.id]!=null&&o[sy.id]>=.75).length });
  const rolesPresent=new Set(members.map(m=>m.role));
  const missingRoles=[...new Set(DATA.systems.flatMap(sy=>sy.owners))].filter(r=>!rolesPresent.has(r));
  const pilotM=members.find(m=>m.pilot);
  const carried=missingRoles.filter(r=>DATA.situations.some(s=>s.rb&&s.aud[0]===r&&pilotM?.answers?.[s.id]));
  const orphan=missingRoles.filter(r=>!carried.includes(r));
  // asks
  const asks={}; members.forEach(m=>Object.values(m.answers||{}).forEach(a=>{ if(a.o===-1&&a.ask) asks[a.ask]=(asks[a.ask]||0)+1 }));
  const disagreements = per.filter(p=>p.agree!=null&&p.agree<.67).sort((a,b)=>a.agree-b.agree);
  const weak = per.filter(p=>p.sc!=null&&p.sc<.5).sort((a,b)=>a.sc-b.sc);
  return {per,sysScore,coverage,alignment,readiness,grant,memberSys,sysCover,missingRoles,carried,orphan,asks,disagreements,weak,status};
}
function fundingRoute(flight,R,members){
  const prof=flight.profile, org=flight.orgtype||"ngo";
  const pilot=members.find(m=>m.pilot)||members[0];
  const c1=DATA.situations.find(s=>s.id==="C1"); const a1=pilot?.answers?.C1; const c1s= a1 ? (a1.o===-1?"u":c1.options[a1.o]?.s) : null;
  const fuel=R.sysScore.fuel??0;
  const external = {ngo:"гранти державних програм і фондів, спонсори, пожертви", biz:"пільгові кредити й мікрокредити, програми підтримки бізнесу, бізнес-ангели", init:"невеликі гранти фондів і муніципалітетів, краудфандинг; для більших сум знадобиться юридична особа"}[org];
  let title,text;
  if(prof==="A"){ title="Фокус — правильно реалізувати грант"; text=`Гроші вже є, тож головний ризик тепер — використання й звітність. ${R.grant!=null&&R.grant<.75?"Грантові ситуації показали прогалини: закрийте їх до першого траншу.":"Грантові правила екіпаж знає добре."}` }
  else if(prof==="G"){ if(fuel>=.7&&(R.sysScore.route??0)>=.6){ title="Власний шлях працює"; text="Фінансова система проєкту виглядає стійко, тож можна рухатися без інвестицій. Зовнішні гроші знадобляться хіба для масштабування." }
    else { title="На старт може знадобитися зовнішнє фінансування"; text=`Гра показала слабкі місця в «Паливі»: запас міцності, окупність або касові розриви. Варто подивитися на такі джерела: ${external}.` } }
  else { if(c1s==="g"){ title="Спершу пробний запуск власними силами, потім фінансування"; text=`Ви можете почати з малого кроку без зовнішніх грошей. Перевірте ідею, а потім залучайте ${prof==="B"?"грант":"фінансування"} на масштабування: з доведеним результатом шанси вищі. Можливі джерела: ${external}.` }
    else { title= prof==="B" ? "Грант — ваш шлях, але після підготовки" : "Вам, найімовірніше, потрібне зовнішнє фінансування"; text=`Можливі джерела: ${external}.` } }
  const todo = R.per.filter(p=>p.s.layer==="grant"&&p.sc!=null&&p.sc<.75).map(p=>p.s.title);
  return {title,text,todo: prof==="G"?[]:todo};
}

function debrief(R,members){
  const items=R.per.filter(p=>p.sc!=null&&p.sc<1).sort((a,b)=>a.sc-b.sc);
  if(!items.length) return `<section class="section"><h2>Розбір польоту</h2><p class="muted">Команда впоралася з усіма ситуаціями. Чудовий результат.</p></section>`;
  const card=p=>{ const good=p.s.options.find(o=>o.s==="g");
    const chosen=members.map(m=>({m,a:m.answers?.[p.s.id]})).filter(x=>x.a);
    const worst=chosen.map(x=>x.a.o>=0?p.s.options[x.a.o]:null).filter(o=>o&&o.s!=="g").sort((a,b)=>SCORE[a.s]-SCORE[b.s])[0];
    const who=chosen.map(({m,a})=>{ const st=a.o===-1?"u":p.s.options[a.o]?.s; return `<span class="who">${esc(m.name)} <span class="tag ${st==="u"?"n":st}">${STATUS[st]}</span></span>` }).join("");
    return `<article class="db"><div class="db-head"><span class="bar" style="background:${colorVar(tone(p.sc))}"></span><div><h3>${esc(p.s.title)}</h3><p class="small muted">${esc(SYS[p.s.sys].name)}${p.learning?" · грантове правило, не впливає на загальну готовність":""}</p></div></div>
      <p class="db-text">${esc(p.s.text)}</p><div class="whos">${who}</div>
      ${worst?`<p><b>Чому це ризик.</b> ${esc(worst.why)}.</p>`:`<p><b>Чому це ризик.</b> Команда не знала, як діяти в цій ситуації.</p>`}
      <p><b>Як краще.</b> ${esc(good.t)}. ${esc(good.why)}.</p></article>` };
  const first=items.slice(0,6), rest=items.slice(6);
  return `<section class="section"><h2>Розбір польоту</h2><p class="muted" style="max-width:40em">Ситуації, у яких команда обрала не найкращий хід або не знала відповіді. Найризиковіші — першими.</p>
   ${first.map(card).join("")}
   ${rest.length?`<details class="more"><summary>Ще ${rest.length} ${plural(rest.length,"ситуація","ситуації","ситуацій")}</summary>${rest.map(card).join("")}</details>`:""}</section>` }
function changesBlock(members,f){
  const sits=situationsFor(f.profile); const rows=[];
  members.forEach(m=>sits.forEach(s=>{ const a=m.answers?.[s.id]; if(!a||!a.ch||!a.ch.length) return;
    const st=o=>o===-1?"u":s.options[o]?.s; const from=st(a.o), to=st(a.ch[a.ch.length-1]);
    rows.push(`<tr><td>${esc(m.name)}</td><td>${esc(s.title)}</td><td><span class="tag ${from==="u"?"n":from}">${STATUS[from]}</span></td><td><span class="tag ${to==="u"?"n":to}">${STATUS[to]}</span></td><td>${a.ch.length}</td></tr>`) }));
  const per={}; members.forEach(m=>{ per[m.name]=sits.filter(s=>m.answers?.[s.id]?.ch?.length).length });
  return `<section class="section"><h2>Змінені відповіді</h2><p class="muted" style="max-width:40em">Цей блок бачите лише ви як керівник рейсу. Учасники знали, що зараховується перша відповідь, а зміни видно у звіті. Один випадок може бути помилковим натисканням, тож звертайте увагу на закономірність.</p>
   ${rows.length?`<p>${Object.entries(per).filter(([,n])=>n).map(([n,c])=>`${esc(n)}: ${c}`).join(", ")}</p><div class="tablewrap"><table class="map left"><thead><tr><th>Учасник</th><th>Ситуація</th><th>Перша відповідь</th><th>Остання</th><th>Змін</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`:`<p>Ніхто з команди не змінював відповідей.</p>`}</section>` }

routes.results = async (app,id) => {
  const s=session.get(); const token = s.pilot?.token && (await API.listFlights(s.pilot.token)||[]).some(f=>f.id===id) ? s.pilot.token : s.members[id];
  if(!token) throw new Error("Результати бачать лише учасники рейсу.");
  const res=await API.results(id,token); const f=res.flight;
  if(!res.unlocked){ const done=f.members.filter(m=>m.finished).length;
    app.innerHTML=`<div class="wrap"><h2>Результати ще в дорозі</h2><div class="panel stack"><p>Завершили ${done} з ${f.crewSize}. Результати відкриються, коли гру пройдуть усі або сплине час рейсу.</p>${runway(done/Math.max(1,f.crewSize))}${s.pilot?`<button class="btn ghost" data-go="flight-${esc(id)}">До рейсу</button>`:""}</div></div>`; return }
  const members=res.members; if(!members.length) throw new Error("Ще ніхто не завершив гру.");
  const R=analyse(f,members); const route=fundingRoute(f,R,members); const pilotView=!!(s.pilot&&token===s.pilot.token);
  const sysOrder=DATA.systems;
  const verdict = R.readiness>=.75 ? "Можна готуватися до зльоту" : R.readiness>=.5 ? "Літак майже готовий, але є системи, які треба доналаштувати" : "До зльоту ще треба попрацювати на землі";
  const roleName=r=>ROLE[r]?.name||r;
  const askLabel=a=> a.startsWith("role:") ? (a==="role:pilot"?"керівника проєкту":"людини з роллю «"+roleName(a.slice(5))+"»") : ({giver:"грантодавця",expert:"зовнішнього експерта"}[a]);
  const askLines = Object.entries(R.asks).sort((a,b)=>b[1]-a[1]).map(([a,n])=>{ const missing=a.startsWith("role:")&&!members.some(m=>m.role===a.slice(5)); return a==="none" ? `<li>${n} раз(и) учасники не знали, до кого звернутися</li>` : `<li>${n} раз(и) звернулися б до ${esc(askLabel(a))}${missing?` — <b>але цієї ролі в екіпажі немає</b>`:""}</li>` }).join("");
  app.innerHTML = `<div class="wrap wide">
   <p class="small muted">${s.pilot?`<button class="linkbtn" data-go="flight-${esc(id)}">До рейсу</button> · `:""}Рейс «${esc(f.project)}» · ${esc(PROF[f.profile]?.name)}</p>
   <section class="reveal"><div class="bignum">${pct(R.readiness)}%</div><h2 style="margin-top:8px">Готовність до зльоту</h2><p class="muted" style="max-width:36em">${verdict}. Це орієнтир, а не прогноз успіху: він показує, наскільки екіпаж готовий до ситуацій, які чекають на проєкт.</p>
   <div style="max-width:640px;margin-top:22px">${runway(R.readiness)}</div></section>
   <div class="kpis">
    <div class="kpi"><div class="v">${R.alignment==null?"—":pct(R.alignment)+"%"}</div><b>Узгодженість екіпажу</b><p class="small muted">${R.alignment==null?"Потрібно щонайменше двоє учасників.":"Наскільки однаково команда бачить ключові рішення."}</p></div>
    ${R.grant!=null?`<div class="kpi"><div class="v">${pct(R.grant)}%</div><b>Готовність до гранту</b><p class="small muted">${f.profile==="A"?"Знання грантових правил.":"Окремий показник: не знижує загальної готовності."}</p></div>`:""}
    <div class="kpi"><div class="v">${members.length}</div><b>Учасників пройшли гру</b><p class="small muted">${members.map(m=>esc(m.name)).join(", ")}</p></div>
   </div>
   <section class="section"><h2>Панель приладів</h2><div class="gauges">${sysOrder.map(sy=>gauge(sy.name,R.sysScore[sy.id])).join("")}</div></section>
   <section class="section"><h2>Що підсвітив ліхтарик</h2>
    ${R.carried.length?`<div class="gap"><span class="bar" style="background:var(--amber)"></span><div><b>Ролі, які закриває керівник:</b> ${R.carried.map(r=>esc(roleName(r))).join(", ")}. Окремої людини на них немає, тож їхні ситуації пройшов керівник проєкту. Варто знайти людину або свідомо залишити ці зони за собою.</div></div>`:""}
    ${R.orphan.length?`<div class="gap"><span class="bar" style="background:var(--coral)"></span><div><b>Ролі без відповідей:</b> ${R.orphan.map(r=>esc(roleName(r))).join(", ")}. Людина з цією роллю не пройшла гру, тож ці зони проєкту залишилися неперевіреними.</div></div>`:""}
    ${R.weak.length?`<p>${R.weak.length} ${plural(R.weak.length,"ситуація","ситуації","ситуацій")} з помітними прогалинами. Подробиці — у розборі польоту нижче.</p>`:`<p class="muted">Критичних прогалин немає.</p>`}
    ${askLines?`<h3 style="margin-top:24px">Чесні «не знаю»</h3><ul>${askLines}</ul>`:""}
   </section>
   ${debrief(R,members)}
   ${pilotView?changesBlock(members,f):""}
   ${R.disagreements.length?`<section class="section"><h2>Де екіпаж бачить по-різному</h2><p class="muted">Розбіжність у відповідях — це ризик: людей вистачає, а спільного розуміння немає.</p>
    ${R.disagreements.slice(0,6).map(p=>`<div class="gap"><span class="bar" style="background:var(--amber)"></span><div><b>${esc(p.s.title)}</b><div class="small">${members.map(m=>{ const st=R.status(p.s,m.answers?.[p.s.id]); return st?`${esc(m.name)}: <span class="tag ${st==="u"?"n":st}">${STATUS[st]}</span>`:"" }).join(" ")}</div></div></div>`).join("")}</section>`:""}
   <section class="section"><h2>Карта компетенцій</h2><p class="muted">Як кожен учасник впорався із ситуаціями кожної системи.</p>
    <div class="tablewrap"><table class="map"><thead><tr><th>Система</th>${members.map(m=>`<th>${esc(m.name)}<div class="small muted">${esc(roleName(m.role))}</div></th>`).join("")}<th>Покриття</th></tr></thead><tbody>
    ${sysOrder.map(sy=>`<tr><td>${esc(sy.name)}</td>${R.memberSys.map(o=>`<td><span class="cell" style="background:${colorVar(tone(o[sy.id]))}" title="${o[sy.id]==null?"—":pct(o[sy.id])+"%"}"></span></td>`).join("")}<td>${R.sysCover[sy.id]>=2?`<span class="tag g">Закрито</span>`:R.sysCover[sy.id]===1?`<span class="tag a">Одна людина</span>`:`<span class="tag c">Немає</span>`}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="legend"><span><i style="background:var(--green)"></i>Готово</span><span><i style="background:var(--amber)"></i>Частково</span><span><i style="background:var(--coral)"></i>Бракує</span></div></section>
   <section class="section"><h2>Маршрут фінансування</h2><div class="route"><h3>${esc(route.title)}</h3><p>${esc(route.text)}</p>${route.todo.length?`<p><b>Що вивчити перед подачею заявки:</b></p><ul>${route.todo.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}</div></section>
   <section class="section panel stack"><h2>Детальний розбір з експертом</h2><p>У розборі вище — що пішло не так і як діяти краще. На консультації ми розберемо кожну прогалину з посиланнями на правила вашої програми, складемо план дій і підкажемо, кого або чого бракує в команді. Зв'яжемося електронною поштою.</p><button class="btn" id="exp">Хочу консультацію</button></section>
   ${s.pilot?"":`<p class="small muted" style="margin-top:28px">Хочете так само перевірити власний проєкт? <button class="linkbtn" data-go="register">Запустити свій рейс</button></p>`}
   <footer>Результат — орієнтир для команди, а не юридична чи фінансова консультація. Правила конкретної програми й рішення про грант мають пріоритет.</footer>
  </div>`;
  $("#exp").onclick=async()=>{ try{ await API.expert(token,id,"results"); $("#exp").outerHTML=`<p><b>Готово.</b> Ми напишемо вам найближчим часом.</p>` }catch(e){ toast(e.message) } };
};

render();
})();
</script>
</body>
</html>
