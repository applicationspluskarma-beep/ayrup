<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ayrup — чи готовий ваш проєкт до зльоту?</title>
<meta name="description" content="Гра-симулятор для НГО та малого бізнесу: команда проживає проєкт наперед і бачить, чого бракує до старту.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --coral:#E26D5A;--amber:#F0B94D;--green:#3FA97A;
  --coral-ink:#B0442F;--amber-ink:#8A5F00;--green-ink:#24714F;
  --surface:#FFFAF4;--raised:#FFFFFF;--sunken:#F6EEE4;--ink:#24201C;--muted:#6B625A;--line:#E8DED3;
  --coral-soft:#FBE4DF;--amber-soft:#FCEFD3;--green-soft:#DDF1E7;
  --grad:linear-gradient(90deg,var(--coral),var(--amber) 50%,var(--green));
  --display:Fredoka,"Arial Rounded MT Bold",system-ui,sans-serif;
  --body:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:8px;--r-md:16px;--r-pill:999px;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --coral-ink:#F09A89;--amber-ink:#F5CB72;--green-ink:#6FD0A3;
  --surface:#1C1A18;--raised:#262320;--sunken:#161412;--ink:#F5EFE8;--muted:#B5ACA3;--line:#3A3531;
  --coral-soft:#3B2622;--amber-soft:#382E1A;--green-soft:#1D3328;color-scheme:dark;}}
:root[data-theme="dark"]{
  --coral-ink:#F09A89;--amber-ink:#F5CB72;--green-ink:#6FD0A3;
  --surface:#1C1A18;--raised:#262320;--sunken:#161412;--ink:#F5EFE8;--muted:#B5ACA3;--line:#3A3531;
  --coral-soft:#3B2622;--amber-soft:#382E1A;--green-soft:#1D3328;color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
#app:focus{outline:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--surface);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(34px,6vw,56px);font-weight:700}
h2{font-size:clamp(24px,3.6vw,32px)}
h3{font-size:20px}
p{margin:0 0 1em}
a{color:var(--green-ink)}
.wrap{max-width:760px;margin:0 auto;padding:24px 20px 64px}
.wide{max-width:1040px}
.muted{color:var(--muted)}
.small{font-size:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;max-width:1040px;margin:0 auto}
.logo{display:inline-flex;height:30px}.logo svg{height:100%;width:auto}
.logo-btn{background:none;border:0;padding:0;cursor:pointer;display:inline-flex}
.btn{font:700 16px/1 var(--body);border:0;border-radius:var(--r-pill);padding:15px 26px;cursor:pointer;background:var(--green);color:#24201C;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{filter:brightness(1.05)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--muted)}
.btn.small{padding:10px 16px;font-size:14px}
.linkbtn{background:none;border:0;color:var(--green-ink);font:inherit;font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:6px}
.banner{background:var(--amber-soft);color:var(--ink);font-size:14px;padding:10px 20px;text-align:center}
.panel{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);padding:24px}
.stack>*+*{margin-top:16px}
label.field{display:block;font-weight:700;font-size:15px}
label.field span.hint{display:block;font-weight:400;color:var(--muted);font-size:14px}
input[type=text],input[type=email],select{width:100%;margin-top:6px;font:16px var(--body);padding:13px 14px;border-radius:var(--r-sm);border:1.5px solid var(--muted);background:var(--raised);color:var(--ink)}
input:focus{outline:none;border-color:var(--green-ink);box-shadow:0 0 0 3px var(--green-soft)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--green)}
.err{color:var(--coral-ink);font-size:14px;font-weight:700;min-height:1em}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--raised);border:1.5px solid var(--line);border-radius:var(--r-md);padding:16px 18px;cursor:pointer;font:inherit;color:inherit}
.choice:hover{border-color:var(--muted)}
.choice[aria-pressed=true]{border-color:var(--green-ink);box-shadow:0 0 0 3px var(--green-soft)}
.choice b{display:block;font-family:var(--display);font-weight:600;font-size:18px}
.choice .dot{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-top:2px}
.choice[aria-pressed=true] .dot{border:7px solid var(--green)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
/* hero */
.hero{display:grid;gap:28px;padding:32px 0 8px}
.hero p.lead{font-size:19px;max-width:34em}
.runway{position:relative;height:14px;border-radius:var(--r-pill);background:var(--sunken);overflow:visible}
.runway .fill{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--grad);background-size:var(--full,100%) 100%}
.runway .plane{position:absolute;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;color:var(--ink);transition:left .6s cubic-bezier(.3,.7,.2,1)}
.runway .fill{transition:width .6s cubic-bezier(.3,.7,.2,1)}
.lights{display:flex;gap:8px}
.lights i{width:14px;height:14px;border-radius:50%;display:block}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;margin:40px 0}
.steps div{border-top:3px solid var(--line);padding-top:14px}
.steps b{font-family:var(--display);font-size:20px;font-weight:600;display:block;margin-bottom:4px}
.steps .n{font-family:var(--display);font-weight:700;color:var(--muted);font-size:15px}
.systems{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.systems li{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-pill);padding:7px 14px;font-size:14px;font-weight:700}
footer{border-top:1px solid var(--line);margin-top:48px;padding-top:20px;font-size:14px;color:var(--muted)}
/* cabinet */
.flight-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.flight-row:last-child{border-bottom:0}
.tag{display:inline-block;font-size:13px;font-weight:800;border-radius:var(--r-pill);padding:4px 10px}
.tag.g{background:var(--green-soft);color:var(--green-ink)}.tag.a{background:var(--amber-soft);color:var(--amber-ink)}.tag.c{background:var(--coral-soft);color:var(--coral-ink)}.tag.n{background:var(--sunken);color:var(--muted)}
.copy{display:flex;gap:8px;margin-top:8px}.copy input{margin:0}
.crew li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.crew{list-style:none;margin:0;padding:0}
/* play */
.playhead{position:sticky;top:0;z-index:5;background:var(--surface);padding:14px 0 12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.playmeta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:var(--muted);margin-bottom:10px;font-weight:700}
.sysname{color:var(--ink);font-family:var(--display);font-weight:600;font-size:16px}
.sit h2{margin-top:18px}
.sit .text{font-size:19px;max-width:36em}
.dunno{margin-top:6px}
.asks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font:700 14px var(--body);border-radius:var(--r-pill);border:1.5px solid var(--line);background:var(--raised);color:var(--ink);padding:9px 14px;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--green-ink);background:var(--green-soft)}
.navrow{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}
.journal{margin-top:20px;border-radius:var(--r-md);padding:18px 20px;border:1.5px solid}
.journal.g{background:var(--green-soft);border-color:var(--green)}.journal.a{background:var(--amber-soft);border-color:var(--amber)}.journal.c{background:var(--coral-soft);border-color:var(--coral)}.journal.n{background:var(--sunken);border-color:var(--line)}
.journal b{font-family:var(--display);font-weight:600}
/* results */
.bignum{font-family:var(--display);font-weight:700;font-size:clamp(88px,16vw,148px);line-height:.9;letter-spacing:-.03em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;margin:28px 0}
.kpi .v{font-family:var(--display);font-weight:700;font-size:40px;line-height:1}
.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:640px){.gauges{grid-template-columns:repeat(2,1fr)}}
.gauge{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;text-align:center}
.gauge svg{width:100%;max-width:120px;display:block;margin:0 auto}
.gauge b{display:block;font-family:var(--display);font-weight:600}
.gauge .pct{font-family:var(--display);font-weight:700;font-size:22px}
.section{margin-top:44px}
.gap{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.gap .bar{flex:0 0 6px;border-radius:3px}
.tablewrap{overflow-x:auto}
table.map{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
table.map th,table.map td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:center}
table.map th:first-child,table.map td:first-child{text-align:left}
table.map td .cell{display:inline-block;width:16px;height:16px;border-radius:50%}
.route{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);padding:24px;border-top:6px solid var(--green)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:var(--r-pill);font-weight:700;font-size:14px;z-index:20}
.reveal{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* landing */
.land .hero{padding-top:40px;padding-bottom:56px}
.land h1{max-width:14em}
.takeoff{max-width:620px;margin-top:6px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.band{background:var(--sunken);padding:8px 0}
.band .wrap{padding-top:48px;padding-bottom:48px}
.two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px;align-items:start}
@media (max-width:760px){.two{grid-template-columns:1fr;gap:12px}}
.two p{max-width:38em}
.aud{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px;margin:8px 0 20px}
.aud h3{margin-bottom:6px}.aud p{margin:0;color:var(--muted)}
.out{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:40px;align-items:start}
@media (max-width:860px){.out{grid-template-columns:1fr}}
.out-list>div{padding:14px 0;border-bottom:1px solid var(--line)}
.out-list>div:first-child{padding-top:0}
.out-list b{font-family:var(--display);font-weight:600;font-size:20px;display:block;margin-bottom:2px}
.out-list p{margin:0;color:var(--muted)}
.preview{margin:0;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);padding:22px}
.preview-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.bignum.sm{font-size:64px}
.gauges.g2{grid-template-columns:repeat(2,1fr)}
ol.steps{list-style:none;padding:0;counter-reset:st}
ol.steps li{counter-increment:st;border-top:3px solid var(--line);padding-top:14px}
ol.steps li::before{content:counter(st);font-family:var(--display);font-weight:700;color:var(--muted);font-size:15px;display:block}
ol.steps li:nth-child(1){border-color:var(--coral)}ol.steps li:nth-child(2),ol.steps li:nth-child(3){border-color:var(--amber)}ol.steps li:nth-child(4){border-color:var(--green)}
.systems li{display:flex;flex-direction:column;border-radius:var(--r-sm);padding:10px 14px}
.systems li span{font-weight:400;color:var(--muted);font-size:13px}
.mission blockquote{font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,40px);line-height:1.2;margin:0 0 20px;max-width:22em}
.mission .m-label{font-weight:800;color:var(--muted);margin-bottom:12px}
.mission .vision{font-size:18px;max-width:38em}
ul.plain{margin:0;padding-left:1.1em}ul.plain li+li{margin-top:8px}
.final{text-align:left;padding-top:24px}
.final h2{max-width:18em}
.rules{background:var(--raised);border:1px solid var(--line);border-left:6px solid var(--amber);border-radius:var(--r-md);padding:18px 20px}
.rules p{margin-bottom:8px}
.navrow.end{justify-content:flex-end}
/* debrief */
.db{padding:20px 0;border-bottom:1px solid var(--line)}
.db-head{display:flex;gap:14px}.db-head .bar{flex:0 0 6px;border-radius:3px}
.db-head h3{margin:0}.db-head p{margin:2px 0 0}
.db-text{margin:12px 0 10px}
.whos{display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:12px;font-size:14px}
.who{display:inline-flex;align-items:center;gap:6px}
details.more summary{cursor:pointer;font-weight:800;color:var(--green-ink);padding:16px 0}
table.map.left td,table.map.left th{text-align:left}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

function gauge(name,v){ const t=tone(v); const a=Math.PI*(v??0); const x=60-50*Math.cos(a), y=60-50*Math.sin(a);

/* ---------- scoring ---------- */
function analyse(flight,members){
  const sits=situationsFor(flight.profile); const prof=flight.profile;
  const status=(s,a)=> !a ? null : a.o===-1 ? "u" : s.options[a.o]?.s;
  const per=sits.map(s=>{ const st=members.map(m=>status(s,m.answers?.[s.id])).filter(Boolean); const sc=st.length?st.reduce((x,y)=>x+SCORE[y],0)/st.length:null;
    const counts={}; st.forEach(x=>counts[x]=(counts[x]||0)+1); const agree= st.length>1 ? Math.max(...Object.values(counts))/st.length : null;
    return {s,st,sc,agree,learning:isLearning(s,prof)} });
  const sysScore={}; DATA.systems.forEach(sy=>{ const xs=per.filter(p=>p.s.sys===sy.id&&!p.learning&&p.sc!=null); sysScore[sy.id]= xs.length ? xs.reduce((a,b)=>a+b.sc,0)/xs.length : null });
  const vals=Object.values(sysScore).filter(v=>v!=null); const coverage= vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
  const ag=per.filter(p=>p.agree!=null&&!p.learning); const alignment= ag.length ? ag.reduce((a,b)=>a+b.agree,0)/ag.length : null;
  const readiness = alignment==null ? coverage : coverage*(.8+.2*alignment);
  const grantSet = per.filter(p=>p.s.layer==="grant"&&p.sc!=null); const grant = (prof!=="G"&&grantSet.length) ? grantSet.reduce((a,b)=>a+b.sc,0)/grantSet.length : null;
  // competence map
  const memberSys = members.map(m=>{ const o={}; DATA.systems.forEach(sy=>{ const xs=sits.filter(s=>s.sys===sy.id).map(s=>status(s,m.answers?.[s.id])).filter(Boolean); o[sy.id]= xs.length? xs.reduce((a,b)=>a+SCORE[b],0)/xs.length : null }); return o });
  const sysCover={}; DATA.systems.forEach(sy=>{ sysCover[sy.id]=memberSys.filter(o=>o[sy.id]!=null&&o[sy.id]>=.75).length });
  const rolesPresent=new Set(members.map(m=>m.role));
  const missingRoles=[...new Set(DATA.systems.flatMap(sy=>sy.owners))].filter(r=>!rolesPresent.has(r));
  const pilotM=members.find(m=>m.pilot);
  const carried=missingRoles.filter(r=>DATA.situations.some(s=>s.rb&&s.aud[0]===r&&pilotM?.answers?.[s.id]));
  const orphan=missingRoles.filter(r=>!carried.includes(r));
  // asks
  const asks={}; members.forEach(m=>Object.values(m.answers||{}).forEach(a=>{ if(a.o===-1&&a.ask) asks[a.ask]=(asks[a.ask]||0)+1 }));
  const disagreements = per.filter(p=>p.agree!=null&&p.agree<.67).sort((a,b)=>a.agree-b.agree);
  const weak = per.filter(p=>p.sc!=null&&p.sc<.5).sort((a,b)=>a.sc-b.sc);
  return {per,sysScore,coverage,alignment,readiness,grant,memberSys,sysCover,missingRoles,carried,orphan,asks,disagreements,weak,status};
}
function fundingRoute(flight,R,members){
  const prof=flight.profile, org=flight.orgtype||"ngo";
  const pilot=members.find(m=>m.pilot)||members[0];
  const c1=DATA.situations.find(s=>s.id==="C1"); const a1=pilot?.answers?.C1; const c1s= a1 ? (a1.o===-1?"u":c1.options[a1.o]?.s) : null;
  const fuel=R.sysScore.fuel??0;
  const external = {ngo:"гранти державних програм і фондів, спонсори, пожертви", biz:"пільгові кредити й мікрокредити, програми підтримки бізнесу, бізнес-ангели", init:"невеликі гранти фондів і муніципалітетів, краудфандинг; для більших сум знадобиться юридична особа"}[org];
  let title,text;
  if(prof==="A"){ title="Фокус — правильно реалізувати грант"; text=`Гроші вже є, тож головний ризик тепер — використання й звітність. ${R.grant!=null&&R.grant<.75?"Грантові ситуації показали прогалини: закрийте їх до першого траншу.":"Грантові правила екіпаж знає добре."}` }
  else if(prof==="G"){ if(fuel>=.7&&(R.sysScore.route??0)>=.6){ title="Власний шлях працює"; text="Фінансова система проєкту виглядає стійко, тож можна рухатися без інвестицій. Зовнішні гроші знадобляться хіба для масштабування." }
    else { title="На старт може знадобитися зовнішнє фінансування"; text=`Гра показала слабкі місця в «Паливі»: запас міцності, окупність або касові розриви. Варто подивитися на такі джерела: ${external}.` } }
  else { if(c1s==="g"){ title="Спершу пробний запуск власними силами, потім фінансування"; text=`Ви можете почати з малого кроку без зовнішніх грошей. Перевірте ідею, а потім залучайте ${prof==="B"?"грант":"фінансування"} на масштабування: з доведеним результатом шанси вищі. Можливі джерела: ${external}.` }
    else { title= prof==="B" ? "Грант — ваш шлях, але після підготовки" : "Вам, найімовірніше, потрібне зовнішнє фінансування"; text=`Можливі джерела: ${external}.` } }
  const todo = R.per.filter(p=>p.s.layer==="grant"&&p.sc!=null&&p.sc<.75).map(p=>p.s.title);
  return {title,text,todo: prof==="G"?[]:todo};
}

function debrief(R,members){
  const items=R.per.filter(p=>p.sc!=null&&p.sc<1).sort((a,b)=>a.sc-b.sc);
  if(!items.length) return `<section class="section"><h2>Розбір польоту</h2><p class="muted">Команда впоралася з усіма ситуаціями. Чудовий результат.</p></section>`;
  const card=p=>{ const good=p.s.options.find(o=>o.s==="g");
    const chosen=members.map(m=>({m,a:m.answers?.[p.s.id]})).filter(x=>x.a);
    const worst=chosen.map(x=>x.a.o>=0?p.s.options[x.a.o]:null).filter(o=>o&&o.s!=="g").sort((a,b)=>SCORE[a.s]-SCORE[b.s])[0];
    const who=chosen.map(({m,a})=>{ const st=a.o===-1?"u":p.s.options[a.o]?.s; return `<span class="who">${esc(m.name)} <span class="tag ${st==="u"?"n":st}">${STATUS[st]}</span></span>` }).join("");
    return `<article class="db"><div class="db-head"><span class="bar" style="background:${colorVar(tone(p.sc))}"></span><div><h3>${esc(p.s.title)}</h3><p class="small muted">${esc(SYS[p.s.sys].name)}${p.learning?" · грантове правило, не впливає на загальну готовність":""}</p></div></div>
      <p class="db-text">${esc(p.s.text)}</p><div class="whos">${who}</div>
      ${worst?`<p><b>Чому це ризик.</b> ${esc(worst.why)}.</p>`:`<p><b>Чому це ризик.</b> Команда не знала, як діяти в цій ситуації.</p>`}
      <p><b>Як краще.</b> ${esc(good.t)}. ${esc(good.why)}.</p></article>` };
  const first=items.slice(0,6), rest=items.slice(6);

   ${first.map(card).join("")}
   ${rest.length?`<details class="more"><summary>Ще ${rest.length} ${plural(rest.length,"ситуація","ситуації","ситуацій")}</summary>${rest.map(card).join("")}</details>`:""}</section>` }
function changesBlock(members,f){
  const sits=situationsFor(f.profile); const rows=[];

   ${rows.length?`<p>${Object.entries(per).filter(([,n])=>n).map(([n,c])=>`${esc(n)}: ${c}`).join(", ")}</p><div class="tablewrap"><table class="map left"><thead><tr><th>Учасник</th><th>Ситуація</th><th>Перша відповідь</th><th>Остання</th><th>Змін</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`:`<p>Ніхто з команди не змінював відповідей.</p>`}</section>` }

  const askLines = Object.entries(R.asks).sort((a,b)=>b[1]-a[1]).map(([a,n])=>{ const missing=a.startsWith("role:")&&!members.some(m=>m.role===a.slice(5)); return a==="none" ? `<li>${n} раз(и) учасники не знали, до кого звернутися</li>` : `<li>${n} раз(и) звернулися б до ${esc(askLabel(a))}${missing?` — <b>але цієї ролі в екіпажі немає</b>`:""}</li>` }).join("");
  app.innerHTML = `<div class="wrap wide">

    ${R.weak.length?`<p>${R.weak.length} ${plural(R.weak.length,"ситуація","ситуації","ситуацій")} з помітними прогалинами. Подробиці — у розборі польоту нижче.</p>`:`<p class="muted">Критичних прогалин немає.</p>`}
